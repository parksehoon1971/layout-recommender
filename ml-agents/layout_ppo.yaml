# 물류센터 레이아웃 순차 배치 학습 설정 (Unity ML-Agents, PPO)
# 실행:  mlagents-learn ml-agents/layout_ppo.yaml --run-id=layout01
# 그 다음 Unity에서 LayoutRL_Training 씬을 열고 Play.

behaviors:
  LayoutPlacer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3          # 엔트로피 보너스: 너무 빨리 한 위치로 굳지 않게
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: match3   # 16×10 격자처럼 작은 이미지에 맞는 CNN 인코더
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 16          # 에피소드가 구역 수(3~5) 스텝이라 짧게
    max_steps: 3000000
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 200000

# 커리큘럼: 구역 3개 → 4개 → 5개
# 보상 = 1 − 4 × (물동량×거리 / 정규화값). 무작위 배치 ≈ 0, 탐욕 기준선 ≈ 0.75 수준.
environment_parameters:
  zone_count:
    curriculum:
      - name: Zones3
        completion_criteria:
          measure: reward
          behavior: LayoutPlacer
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.6
        value: 3
      - name: Zones4
        completion_criteria:
          measure: reward
          behavior: LayoutPlacer
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 0.6
        value: 4
      - name: Zones5
        value: 5

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  no_graphics: false
